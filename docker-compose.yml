services:
  arzansite-be:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: arzansite-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - APPWRITE_ENDPOINT=${APPWRITE_ENDPOINT}
      - APPWRITE_PROJECT_ID=${APPWRITE_PROJECT_ID}
      - APPWRITE_API_KEY=${APPWRITE_API_KEY}
      - APPWRITE_DATABASE_ID=${APPWRITE_DATABASE_ID}
      - APPWRITE_COLLECTION_ORDERS=${APPWRITE_COLLECTION_ORDERS}
      - APPWRITE_COLLECTION_DESIGNS=${APPWRITE_COLLECTION_DESIGNS}
      - APPWRITE_COLLECTION_WALLETS=${APPWRITE_COLLECTION_WALLETS}
      - APPWRITE_COLLECTION_TRANSACTIONS=${APPWRITE_COLLECTION_TRANSACTIONS}
      - APPWRITE_COLLECTION_PAYMENT_TRANSACTIONS=${APPWRITE_COLLECTION_PAYMENT_TRANSACTIONS}
      - APPWRITE_COLLECTION_PROFILES=${APPWRITE_COLLECTION_PROFILES}
      - APPWRITE_COLLECTION_USER_ROLES=${APPWRITE_COLLECTION_USER_ROLES}
      - APPWRITE_COLLECTION_EMAIL_LOGS=${APPWRITE_COLLECTION_EMAIL_LOGS}
      - APPWRITE_COLLECTION_SITE_CONFIG=${APPWRITE_COLLECTION_SITE_CONFIG}
      - FRONTEND_URL=${FRONTEND_URL}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - ZARINPAL_MERCHANT_ID=${ZARINPAL_MERCHANT_ID}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_SENDER_NAME=${SMTP_SENDER_NAME}
      - SMTP_SECURITY=${SMTP_SECURITY}
      - PORT=3000
    env_file:
      - .env
    networks:
      - arzansite-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

